version: "3.9"
services:
  redis:
    image: "redis:alpine"
    container_name: redis-beer
    ports:
      - "6379:6379"

  api:
    container_name: fastapi-beer
    restart: always
    build:
      context: "api"
      dockerfile: "Dockerfile"
    command: uvicorn app.main:app --host 0.0.0.0 --port 443 --ssl-certfile /code/certificate/cert.pem --ssl-keyfile /code/certificate/key.pem
    ports:
      - "8000:443"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////data/beer.db
      - IMAGES_PATH=/data/imgs
      - MODEL_PATH=/data/saved_encodings
    volumes:
      - ./api/data:/data
      - ./api/certificate:/code/certificate:ro
    depends_on:
      - redis

  face-recognition-worker:
    container_name: worker-beer
    restart: always
    build:
      context: "api"
      dockerfile: "Dockerfile"
    command: python -m app.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////data/beer.db
      - IMAGES_PATH=/data/imgs
      - MODEL_PATH=/data/saved_encodings
    volumes:
      - ./api/data:/data
    depends_on:
      - redis
      - api
  frontend:
    container_name: frontend-beer
    restart: always
    build:
      context: "frontend"
      dockerfile: "docker/Dockerfile"
    depends_on:
      - api
    ports:
      - "8080:443"
    volumes:
      - ./api/certificate:/etc/nginx/certs:ro
  mqtt-service:
    container_name: mqtt-beer
    restart: always
    build:
      context: "MQTT-service"
      dockerfile: "Dockerfile"
    environment:
      - MQTT_TARGET_TOPIC=${MQTT_TARGET_TOPIC:-beer/quantity}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - API_URL=https://api:443/drinks
      - MQTT_SERVER=${MQTT_SERVER}
      - MQTT_PORT=${MQTT_PORT:-1883}
    depends_on:
      - api