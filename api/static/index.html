<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <title>Simple - Real time face detection</title>
  </head>

  <body>
    <div class="container">
      <h1 class="my-3">Simple - Real time face detection</h1>
      <form id="form-connect">
        <div class="input-group mb-3">
          <select id="camera-select"></select>
          <button class="btn btn-success" type="submit" id="button-start">Start</button>
        </div>
      </form>
      <div class="position-relative">
        <video id="video"></video>
        <canvas id="canvas" class="position-absolute top-0 start-0"></canvas>
      </div>
      <div>
        <h2 id="record_feedback_field">Record Images: </h2>
        <form id="form-record">
          <button class="btn btn-success" type="submit" id="button-record">Record</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>

</html>
